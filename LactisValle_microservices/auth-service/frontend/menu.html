<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LactisValle — Menú Principal</title>
    <link rel="stylesheet" href="menu.css">
</head>
<body style="background-color: #0f172a; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: sans-serif;">

    <div class="login-card" style="background: #1e293b; padding: 30px; border-radius: 16px; width: 100%; max-width: 400px; color: white; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
        
        <!-- Icono y Título Principal -->
        <div style="font-size: 3rem; margin-bottom: 10px;">🐄</div>
        <h1 style="color: #38bdf8; margin: 0 0 5px 0; font-size: 1.8rem;">LactisValle</h1>
        <p style="color: #94a3b8; font-size: 0.85rem; margin-bottom: 20px;">Panel de Control General</p>

        <div id="userBadge" class="user-badge">👤 Operario: Cargando...</div>


        <div class="menu-options">

            <a href="dashboard.html" class="btn-menu">
                <span style="font-size: 1.6rem;">📋</span>
                <div style="text-align: left;">
                    <div style="color: #ffffff; font-size: 1rem;">Dashboard de Ordeño</div>
                    <small style="color: #94a3b8; font-weight: normal; font-size: 0.8rem;">Registro local de pesajes y cola FIFO</small>
                </div>
            </a>

            <a href="reports.html" class="btn-menu">
                <span style="font-size: 1.6rem;">📊</span>
                <div style="text-align: left;">
                    <div style="color: #ffffff; font-size: 1rem;">Reportes y Estadísticas</div>
                    <small style="color: #94a3b8; font-weight: normal; font-size: 0.8rem;">Análisis visual de producción y alertas</small>
                </div>
            </a>
      <button type="button" class="btn-logout-custom" onclick="cerrarSesion()">
    🔒 Cerrar Sesión
</button>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const usuarioSesion = sessionStorage.getItem('usuario_autenticado');

            if (!usuarioSesion) {
                alert('🔒 Acceso denegado: Debes iniciar sesión primero.');
                window.location.href = 'index.html';
                return;
            }

            const datosUser = JSON.parse(usuarioSesion);
            document.getElementById('userBadge').textContent = `👤 Operario: ${datosUser.usuario}`;
        });

        function cerrarSesion() {
            sessionStorage.removeItem('usuario_autenticado');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
