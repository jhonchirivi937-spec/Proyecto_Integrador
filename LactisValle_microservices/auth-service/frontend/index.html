<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LactisValle — Acceso al Sistema</title>
    <link rel="stylesheet" href="inicio_S.css">
</head>
<body style="background-color: #0f172a; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: sans-serif;">

    <div class="login-card" style="background: #1e293b; padding: 30px; border-radius: 12px; width: 100%; max-width: 380px; color: white; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
        <div style="font-size: 3rem; margin-bottom: 10px;">🐄</div>
        <h1 style="color: #38bdf8; margin: 0 0 5px 0; font-size: 1.8rem;">LactisValle</h1>
        <p style="color: #94a3b8; font-size: 0.85rem; margin-bottom: 25px;">Sistema de Control Lechero - Valle de Ubaté</p>
        <h3 id="formTitle" style="margin-bottom: 20px; font-weight: 500;">Acceso al Sistema</h3>
        <div id="loginAlert" style="display: none; padding: 10px; margin-bottom: 15px; border-radius: 6px; font-size: 0.85rem; text-align: center;"></div>
        <form id="loginForm">
            <div style="margin-bottom: 15px; text-align: left;">
                <input 
                    type="text" 
                    id="loginUser" 
                    placeholder="Usuario o cédula" 
                    required 
                    style="width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box;"
                >
            </div>

            <div style="margin-bottom: 20px; text-align: left;">
                <input 
                    type="password" 
                    id="loginPassword" 
                    placeholder="Contraseña" 
                    required 
                    style="width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box;"
                >
            </div>

            <button 
                type="submit" 
                id="btnLogin" 
                style="width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem;"
            >
                Ingresar
            </button>
        </form>
        <div style="margin: 20px 0; color: #64748b; font-size: 0.8rem;">ó</div>
        <button 
            type="button" 
            id="btnRegisterToggle" 
            onclick="toggleModoRegistro()" 
            style="width: 100%; padding: 10px; background: transparent; border: 1px solid #38bdf8; color: #38bdf8; border-radius: 6px; cursor: pointer; margin-bottom: 15px; font-weight: bold;"
        >
            📑 Registrar Usuario
        </button>

        <button 
            type="button" 
            onclick="descargarBaseDatosJSON()" 
            style="width: 100%; padding: 8px; background: #334155; border: none; color: #cbd5e1; border-radius: 6px; cursor: pointer; font-size: 0.8rem;"
        >
            📲 Descargar Base de Datos (JSON)
        </button>
    </div>
    <script src="inicio_S.js"></script>
</body>
</html>
